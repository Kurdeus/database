name: TelegramDownloader

on:
  workflow_dispatch:
    inputs:
      telegram_link:
        description: '🔗 Telegram post link'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📂 Clone repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq openssl

      - name: 📡 Get direct link and fix spaces
        id: get_link
        run: |
          TELEGRAM_LINK="${{ github.event.inputs.telegram_link }}"
          RESPONSE=$(curl -s -X POST \
            -H "User-Agent: Mozilla/5.0" \
            -d "telegram_link=$TELEGRAM_LINK" \
            https://telegramdownloader.net/proxy.php)

          RAW_URL=$(echo "$RESPONSE" | jq -r '.data.data.link')
          FILE_NAME=$(echo "$RESPONSE" | jq -r '.data.data.file_name')

          if [ -z "$RAW_URL" ] || [ "$RAW_URL" = "null" ]; then
            echo "❌ Error: Could not get download link!"
            exit 1
          fi

          CORRECTED_URL=$(echo "$RAW_URL" | sed 's/%20/-/g' | sed 's/ /-/g')
          echo "download_url=$CORRECTED_URL" >> $GITHUB_OUTPUT
          echo "original_name=$FILE_NAME" >> $GITHUB_OUTPUT

      - name: ⬇️ Download file into books/
        id: download
        run: |
          URL="${{ steps.get_link.outputs.download_url }}"
          ORIGINAL_NAME="${{ steps.get_link.outputs.original_name }}"
          mkdir -p books

          FINAL_NAME="$ORIGINAL_NAME"
          # اگر فایلی با همین نام از قبل در books وجود داشته باشد، یک پسوند عددی اضافه می‌شود
          if [ -e "books/$FINAL_NAME" ]; then
            BASE="${FINAL_NAME%.*}"
            EXT="${FINAL_NAME##*.}"
            i=1
            while [ -e "books/${BASE}_${i}.${EXT}" ]; do
              i=$((i+1))
            done
            FINAL_NAME="${BASE}_${i}.${EXT}"
          fi

          curl -L --progress-bar --max-time 7200 --retry 10 -o "books/$FINAL_NAME" "$URL"

          SIZE=$(stat -c%s "books/$FINAL_NAME")
          echo "file_size=$SIZE" >> $GITHUB_OUTPUT
          echo "downloaded_name=$FINAL_NAME" >> $GITHUB_OUTPUT

      - name: 🔄 Fix filename (clean/ascii-safe)
        run: |
          cd books
          FILENAME="${{ steps.download.outputs.downloaded_name }}"
          [ -e "$FILENAME" ] || exit 0
          EXT="${FILENAME##*.}"
          if [[ "$FILENAME" =~ [^[:ascii:]] ]]; then
            NEW_NAME="$(openssl rand -hex 8).${EXT}"
            mv "$FILENAME" "$NEW_NAME"
          else
            CLEAN_NAME=$(echo "$FILENAME" | sed 's/[^a-zA-Z0-9._-]/_/g' | sed 's/__*/_/g')
            [ "$CLEAN_NAME" != "$FILENAME" ] && mv "$FILENAME" "$CLEAN_NAME"
          fi
          cd ..

      - name: 📤 Upload raw file to GitHub (books/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add books/
          git commit -m "Add file to books/ [skip ci]" || echo "Nothing to commit"
          git push origin main || true
